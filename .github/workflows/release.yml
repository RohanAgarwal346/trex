# One push -> new desktop installers (Windows / macOS / Linux) AND a new Android APK, all attached to the same GitHub Release.
# The UI itself is served by the Drishti AI server, so both apps also pick up UI changes the moment the server is updated.
name: Build desktop and Android apps

on:
  push:
    branches: [main]
    paths: ['cctv-ai/**', 'apps/**', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: 1.0.${{ github.run_number }}

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build and publish desktop installer
        working-directory: apps/desktop
        shell: bash
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --publish always -c.extraMetadata.version=$VERSION
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    runs-on: ubuntu-latest
    needs: desktop            # the release (tag v$VERSION) already exists by now
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Prepare web assets
        working-directory: apps/android
        run: |
          npm install --no-audit --no-fund
          npx cap sync android
      - name: Restore signing key (optional)
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret - building a debug-signed APK. Add the secret so future APKs install over old ones."
          fi
      - name: Build APK
        working-directory: apps/android/android
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: ${{ env.VERSION }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_PATH" ]; then ./gradlew assembleRelease; cp app/build/outputs/apk/release/app-release.apk ../Drishti-AI.apk
          else ./gradlew assembleDebug; cp app/build/outputs/apk/debug/app-debug.apk ../Drishti-AI.apk; fi
      - name: Attach APK to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          files: apps/android/Drishti-AI.apk
