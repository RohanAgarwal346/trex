<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080818">
<title>Drishti AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(700px 420px at 0 0,#3b1d7a,transparent),radial-gradient(600px 420px at 100% 100%,#7a1d56,transparent),#080818;color:#fff;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.c{width:min(420px,100%);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:26px;text-align:center}
.mark{width:84px;height:84px;margin:0 auto 14px;border-radius:26px;background:linear-gradient(135deg,#8b5cf6,#ec4899);display:grid;place-items:center;font-size:46px;box-shadow:0 12px 40px rgba(236,72,153,.5)}
h1{margin:0}p{color:#b4b4d8;font-size:14px;line-height:1.5}
input{width:100%;padding:14px;border-radius:14px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.3);color:#fff;font-size:16px;margin:10px 0}
button{width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,#8b5cf6,#ec4899)}
#msg{min-height:22px;font-size:14px;color:#fda4af;margin-top:10px}
</style>
</head>
<body>
<div class="c">
  <div class="mark">👁️</div>
  <h1>Drishti AI</h1>
  <p>Enter the address of your Drishti AI server, for example <b>http://192.168.1.20:8800</b> (the computer running the desktop app).</p>
  <input id="u" inputmode="url" autocapitalize="off" autocomplete="off" placeholder="http://192.168.1.20:8800">
  <button id="go">Connect</button>
  <div id="msg"></div>
</div>
<script>
const KEY = 'drishti_server';
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const saved = localStorage.getItem(KEY);
if (saved) $('u').value = saved;

function norm(u) {
  u = u.trim();
  if (!u) return '';
  if (!/^https?:\/\//i.test(u)) u = 'http://' + u;
  return u.replace(/\/+$/, '');
}
async function connect(url, auto) {
  $('msg').style.color = '#b4b4d8';
  $('msg').textContent = 'Connecting…';
  try {
    const r = await fetch(url + '/api/auth', { headers: { 'X-Requested-With': 'drishti' } });   // native HTTP (no CORS) via Capacitor
    if (!r.ok && r.status !== 401) throw new Error('HTTP ' + r.status);
    localStorage.setItem(KEY, url);
    location.replace(url);
  } catch (e) {
    $('msg').style.color = '#fda4af';
    $('msg').textContent = auto ? 'Could not reach ' + url + '. Check Wi-Fi and that the server is running.' : 'Could not connect. Check the address, Wi-Fi and that the server is running.';
  }
}
$('go').onclick = () => { const u = norm($('u').value); if (u) connect(u, false); else $('msg').textContent = 'Please enter the server address.'; };
$('u').onkeydown = e => { if (e.key === 'Enter') $('go').click(); };
if (saved && !params.has('change')) connect(saved, true);
</script>
</body>
</html>
