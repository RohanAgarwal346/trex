<!doctype html><meta charset="utf-8"><title>Connect to a server</title>
<style>
body{margin:0;height:100vh;display:grid;place-items:center;background:#080818;color:#fff;font-family:system-ui,'Segoe UI',sans-serif}
.c{width:min(420px,90vw);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:28px}
h2{margin:0 0 8px}p{color:#b4b4d8;font-size:14px;line-height:1.5}input{width:100%;box-sizing:border-box;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.3);color:#fff;font-size:15px;margin:12px 0}
button{border:0;border-radius:12px;padding:11px 18px;font-weight:600;font-size:15px;color:#fff;cursor:pointer;background:linear-gradient(135deg,#8b5cf6,#ec4899)}button.g{background:rgba(255,255,255,.12);margin-left:8px}
</style>
<div class="c"><h2>Connect to another server</h2><p>Enter the address of a Drishti AI server, for example <b>http://192.168.1.20:8800</b>. Leave empty to use this computer.</p>
<input id="u" placeholder="http://192.168.1.20:8800" autofocus><button id="go">Connect</button><button class="g" id="loc">Use this computer</button></div>
<script>
document.getElementById('go').onclick=()=>window.drishti.setServer(document.getElementById('u').value.trim());
document.getElementById('loc').onclick=()=>window.drishti.setServer('');
document.getElementById('u').onkeydown=e=>e.key==='Enter'&&document.getElementById('go').click();
</script>
