<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rohpo Staff · Admin</title>
<style>
:root{--ink:#1e1b4b;--mut:#6b7280;--p:#7c3aed;--bg:#f5f3ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:linear-gradient(135deg,#5b21b6,#c026d3 55%,#f97316);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header img{width:46px;height:46px;border-radius:12px}header h1{margin:0;font-size:20px;flex:1}
nav{display:flex;gap:6px;padding:12px 22px;flex-wrap:wrap;background:#fff;box-shadow:0 2px 10px #4c1d9511;position:sticky;top:0;z-index:5}
nav button{border:0;background:#ede9fe;color:#5b21b6;padding:9px 16px;border-radius:99px;font-weight:700;cursor:pointer;font-size:14px}nav button.on{background:var(--p);color:#fff}
main{padding:20px 22px;max-width:1150px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px}
.tile{border-radius:18px;padding:18px;color:#fff;box-shadow:0 6px 18px #0002}.tile b{display:block;font-size:34px;line-height:1.1}.tile span{opacity:.95;font-weight:600}
.t1{background:linear-gradient(135deg,#059669,#34d399)}.t2{background:linear-gradient(135deg,#7c3aed,#a78bfa)}.t3{background:linear-gradient(135deg,#0284c7,#38bdf8)}.t4{background:linear-gradient(135deg,#ea580c,#fbbf24)}.t5{background:linear-gradient(135deg,#be123c,#fb7185)}
.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:18px;box-shadow:0 4px 16px #4c1d9511;overflow-x:auto}
h2{margin:0 0 12px;font-size:18px}table{border-collapse:collapse;width:100%;min-width:560px}th{text-align:left;color:var(--mut);font-size:12.5px;text-transform:uppercase;letter-spacing:.04em}th,td{padding:9px 10px;border-bottom:1px solid #f1f0f9}
input,select{padding:9px 11px;border:2px solid #ddd6fe;border-radius:10px;font-size:14px;font-family:inherit}button.b{border:0;background:var(--p);color:#fff;padding:9px 15px;border-radius:10px;font-weight:700;cursor:pointer}button.s{border:0;background:#ede9fe;color:#5b21b6;padding:5px 10px;border-radius:8px;font-weight:700;cursor:pointer;font-size:12.5px}button.d{background:#fee2e2;color:#b91c1c}
.form{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:12px}.form label{font-size:12px;color:var(--mut);font-weight:700;display:flex;flex-direction:column;gap:3px}
.badge{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700}.pending{background:#fef3c7;color:#92400e}.synced,.in{background:#d1fae5;color:#065f46}.failed,.out{background:#fee2e2;color:#991b1b}
.mut{color:var(--mut)}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;z-index:20}
#login{max-width:340px;margin:12vh auto;background:#fff;padding:26px;border-radius:22px;box-shadow:0 12px 40px #4c1d9533;text-align:center}#login img{width:84px;border-radius:20px;margin-top:-62px;box-shadow:0 6px 20px #0004}#login input{width:100%;margin:12px 0}
code{background:#ede9fe;padding:2px 7px;border-radius:6px;word-break:break-all}
</style></head><body>
<div id="login" hidden><img src="/logo.png" alt=""><h2>Rohpo Staff Admin</h2><input id="pw" type="password" placeholder="Admin password"><button class="b" style="width:100%" id="lg">Login</button><div id="lerr" style="color:#b91c1c;margin-top:8px"></div></div>
<div id="root" hidden>
<header><img src="/logo.png" alt=""><h1>Rohpo Staff · Admin</h1><button class="s" onclick="logout()">Logout</button></header>
<nav id="nav"></nav><main id="main"></main></div><div id="toast" hidden></div>
<script>
const $=(s)=>document.querySelector(s);let T=sessionStorage.getItem('adm'),tab='dash',tt;
const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const IST=19800000,hm=ts=>new Date(ts+IST).toISOString().slice(11,16),today=()=>new Date(Date.now()+IST).toISOString().slice(0,10);
const inr=n=>'₹'+Number(n).toLocaleString('en-IN',{maximumFractionDigits:2});
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3000)}
async function api(p,m='GET',b){const r=await fetch(p,{method:m,headers:{'content-type':'application/json',authorization:'Bearer '+T},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(r.status===401&&p!=='/api/admin/login'){logout();throw Error('Please log in')}if(!r.ok)throw Error(j.error||r.status);return j}
const act=async(fn)=>{try{await fn()}catch(e){toast(e.message)}};
async function dl(path,name){const r=await fetch(path,{headers:{authorization:'Bearer '+T}});const u=URL.createObjectURL(await r.blob());const a=document.createElement('a');a.href=u;a.download=name;a.click()}
function logout(){T=null;sessionStorage.removeItem('adm');start()}
$('#lg').onclick=()=>act(async()=>{$('#lerr').textContent='';try{const r=await api('/api/admin/login','POST',{password:$('#pw').value});T=r.token;sessionStorage.setItem('adm',T);start()}catch(e){$('#lerr').textContent=e.message}});
$('#pw').onkeydown=e=>e.key==='Enter'&&$('#lg').click();
const TABS=[['dash','📊 Dashboard'],['att','📍 Attendance'],['rc','💰 Receipts'],['staff','👥 Staff'],['gd','🏭 Godowns'],['set','⚙️ Settings & Tally']];
function start(){$('#login').hidden=!!T;$('#root').hidden=!T;if(!T)return;$('#nav').innerHTML=TABS.map(([k,l])=>`<button data-k="${k}" class="${tab===k?'on':''}">${l}</button>`).join('');document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.k;start()});act(()=>VIEWS[tab]())}
const VIEWS={
async dash(){const s=await api('/api/admin/summary');const seen=s.bridge_last_seen?Math.round((Date.now()-s.bridge_last_seen)/60000):null;
$('#main').innerHTML=`<div class="grid"><div class="tile t1"><b>${s.present}/${s.total}</b><span>Present today</span></div><div class="tile t2"><b>${s.receipts_today}</b><span>Receipts today</span></div><div class="tile t3"><b>${inr(s.amount_today)}</b><span>Collected today</span></div><div class="tile t4"><b>${s.pending}</b><span>Waiting for Tally</span></div><div class="tile t5"><b>${s.failed}</b><span>Failed in Tally</span></div></div>
<div class="card"><h2>Tally bridge</h2>${seen===null?'<span class="badge failed">Not connected yet</span> Install the bridge on the Tally PC (see Settings & Tally).':seen<3?`<span class="badge synced">Connected</span> last seen ${seen} min ago · ${s.ledgers} customers loaded from Tally`:`<span class="badge pending">Offline</span> last seen ${seen} min ago — is the Tally PC on and bridge running?`}</div>`},
async att(){const f=window._af||(window._af={from:today(),to:today()});$('#main').innerHTML=`<div class="card"><div class="form"><label>From<input type="date" id="f" value="${f.from}"></label><label>To<input type="date" id="t" value="${f.to}"></label><button class="b" id="go">Show</button><button class="s" id="csv">⬇ CSV (Attendance Pro / Excel)</button></div><div id="out"></div></div>`;
const load=async()=>{f.from=$('#f').value;f.to=$('#t').value;const r=await api(`/api/admin/attendance?from=${f.from}&to=${f.to}`);$('#out').innerHTML=`<h2>Daily summary</h2><table><tr><th>Date</th><th>Staff</th><th>In</th><th>Out</th><th>Hours</th><th>Godown</th></tr>${r.days.map(d=>`<tr><td>${d.day}</td><td><b>${esc(d.staff)}</b><div class="mut">${d.mobile}</div></td><td>${d.in_time||'-'}</td><td>${d.out_time||'<span class="mut">not out</span>'}</td><td>${d.hours||'-'}</td><td>${esc(d.in_godown)}</td></tr>`).join('')||'<tr><td colspan=6 class="mut">No attendance</td></tr>'}</table>
<h2 style="margin-top:20px">All punches</h2><table><tr><th>Date</th><th>Time</th><th>Staff</th><th></th><th>Godown</th><th>Distance</th><th>Map</th></tr>${r.punches.map(p=>`<tr><td>${p.day}</td><td>${hm(p.ts)}</td><td>${esc(p.staff)}</td><td><span class="badge ${p.type}">${p.type.toUpperCase()}</span></td><td>${esc(p.godown)}</td><td>${Math.round(p.distance_m)} m</td><td><a href="https://maps.google.com/?q=${p.lat},${p.lng}" target="_blank" rel="noopener">view</a></td></tr>`).join('')}</table>`};
$('#go').onclick=()=>act(load);$('#csv').onclick=()=>dl(`/api/admin/attendance.csv?from=${$('#f').value}&to=${$('#t').value}`,'attendance.csv');await load()},
async rc(){const f=window._rf||(window._rf={from:'',to:'',status:''});$('#main').innerHTML=`<div class="card"><div class="form"><label>From<input type="date" id="f" value="${f.from}"></label><label>To<input type="date" id="t" value="${f.to}"></label><label>Status<select id="s"><option value="">All</option><option>pending</option><option>synced</option><option>failed</option></select></label><button class="b" id="go">Show</button><button class="s" id="csv">⬇ CSV</button></div><div id="out"></div></div>`;$('#s').value=f.status;
const load=async()=>{f.from=$('#f').value;f.to=$('#t').value;f.status=$('#s').value;const r=await api(`/api/admin/receipts?from=${f.from}&to=${f.to}&status=${f.status}`);$('#out').innerHTML=`<table><tr><th>#</th><th>Date</th><th>Staff</th><th>Customer</th><th>Amount</th><th>Mode</th><th>Bills</th><th>Tally</th><th></th></tr>${r.map(x=>{const b=JSON.parse(x.bills).map(b=>`${esc(b.ref)} (${b.amount})`).join(', ');return`<tr><td>${x.id}</td><td>${x.vdate}</td><td>${esc(x.staff)}</td><td><b>${esc(x.party)}</b></td><td><b>${inr(x.amount)}</b></td><td>${x.mode}</td><td class="mut">${b}</td><td><span class="badge ${x.status}">${x.status}</span>${x.voucher_no?' #'+esc(x.voucher_no):''}${x.error?`<div class="mut" style="color:#b91c1c;max-width:260px">${esc(x.error)}</div>`:''}</td><td>${x.status==='failed'?`<button class="s" data-r="${x.id}">Retry</button> `:''}${x.status!=='synced'?`<button class="s d" data-x="${x.id}">Delete</button>`:''}</td></tr>`}).join('')||'<tr><td colspan=9 class="mut">No receipts</td></tr>'}</table>`;
document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>act(async()=>{await api(`/api/admin/receipts/${b.dataset.r}/retry`,'POST');toast('Queued again');load()}));document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>confirm('Delete this receipt?')&&act(async()=>{await api(`/api/admin/receipts/${b.dataset.x}`,'DELETE');load()}))};
$('#go').onclick=()=>act(load);$('#csv').onclick=()=>dl(`/api/admin/receipts.csv?from=${$('#f').value}&to=${$('#t').value}`,'receipts.csv');await load()},
async staff(){const r=await api('/api/admin/staff');$('#main').innerHTML=`<div class="card"><h2>Add staff</h2><div class="form"><label>Name<input id="n"></label><label>Mobile (10 digit)<input id="m" inputmode="numeric" maxlength="10"></label><label>PIN (4-6 digits)<input id="p" maxlength="6" inputmode="numeric"></label><label>Role<select id="r"><option value="staff">Staff</option><option value="manager">Manager (can set godown GPS)</option></select></label><button class="b" id="add">Add</button></div><div class="mut">Give the staff their mobile number + PIN. They install the APK and log in with these.</div></div>
<div class="card"><table><tr><th>Name</th><th>Mobile</th><th>Role</th><th>Phone</th><th>Last login</th><th>Receipts</th><th>Active</th><th></th></tr>${r.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${s.mobile}</td><td>${s.role}</td><td>${s.has_device?'🔒 bound':'—'}</td><td class="mut">${s.last_login?new Date(s.last_login+IST).toISOString().slice(0,16).replace('T',' '):'never'}</td><td>${s.can_receipt?'✔':'✖'}</td><td>${s.active?'✔':'<span class="badge failed">disabled</span>'}</td><td><button class="s" data-pin="${s.id}">New PIN</button> <button class="s" data-dev="${s.id}">Reset phone</button> <button class="s" data-rc="${s.id}" data-v="${s.can_receipt?0:1}">${s.can_receipt?'Stop receipts':'Allow receipts'}</button> <button class="s ${s.active?'d':''}" data-act="${s.id}" data-v="${s.active?0:1}">${s.active?'Disable':'Enable'}</button></td></tr>`).join('')}</table></div>`;
$('#add').onclick=()=>act(async()=>{await api('/api/admin/staff','POST',{name:$('#n').value,mobile:$('#m').value,pin:$('#p').value,role:$('#r').value});toast('Staff added');VIEWS.staff()});
const put=(id,b,m)=>act(async()=>{await api('/api/admin/staff/'+id,'PUT',b);toast(m);VIEWS.staff()});
document.querySelectorAll('[data-pin]').forEach(b=>b.onclick=()=>{const p=prompt('New PIN (4-6 digits)');if(p)put(b.dataset.pin,{pin:p},'PIN changed')});
document.querySelectorAll('[data-dev]').forEach(b=>b.onclick=()=>put(b.dataset.dev,{reset_device:true},'Phone binding reset — staff can log in from a new phone'));
document.querySelectorAll('[data-rc]').forEach(b=>b.onclick=()=>put(b.dataset.rc,{can_receipt:b.dataset.v==='1'},'Updated'));
document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>put(b.dataset.act,{active:b.dataset.v==='1'},'Updated'))},
async gd(){const r=await api('/api/admin/godowns');const row=g=>`<tr><td><input data-f="name" value="${esc(g.name)}"></td><td><input data-f="lat" size="10" value="${g.lat??''}"></td><td><input data-f="lng" size="10" value="${g.lng??''}"></td><td><input data-f="radius_m" size="4" value="${g.radius_m}"> m</td><td><button class="s" data-here>📍 Use my location</button> <button class="b" data-save="${g.id}">Save</button> <button class="s ${g.active?'d':''}" data-tg="${g.id}">${g.active?'Disable':'Enable'}</button></td></tr>`;
$('#main').innerHTML=`<div class="card"><h2>Godowns</h2><div class="mut" style="margin-bottom:10px">Staff can punch only within the radius (default 100 m) of a godown. Easiest way to set the point: stand at the godown with your phone, log in as a <b>Manager</b> in the app → Profile → “Set here”. Or paste latitude/longitude from Google Maps (long-press on the godown → copy the numbers).</div><table><tr><th>Name</th><th>Latitude</th><th>Longitude</th><th>Radius</th><th></th></tr>${r.map(row).join('')}<tr id="new"><td><input data-f="name" placeholder="New godown name"></td><td><input data-f="lat" size="10"></td><td><input data-f="lng" size="10"></td><td><input data-f="radius_m" size="4" value="100"> m</td><td><button class="s" data-here>📍 Use my location</button> <button class="b" id="addg">Add</button></td></tr></table></div>`;
const get=tr=>{const o={};tr.querySelectorAll('[data-f]').forEach(i=>o[i.dataset.f]=i.value);return o};
document.querySelectorAll('[data-here]').forEach(b=>b.onclick=()=>{const tr=b.closest('tr');if(!navigator.geolocation)return toast('Not supported');navigator.geolocation.getCurrentPosition(p=>{tr.querySelector('[data-f=lat]').value=p.coords.latitude.toFixed(6);tr.querySelector('[data-f=lng]').value=p.coords.longitude.toFixed(6);toast('Location filled — now press Save/Add')},e=>toast('Browser blocked location (needs https). Use the app Manager option or paste from Google Maps.'),{enableHighAccuracy:true})});
$('#addg').onclick=()=>act(async()=>{await api('/api/admin/godowns','POST',get($('#new')));toast('Godown added');VIEWS.gd()});
document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>act(async()=>{await api('/api/admin/godowns/'+b.dataset.save,'PUT',{...get(b.closest('tr')),active:r.find(g=>g.id==b.dataset.save).active==1});toast('Saved');VIEWS.gd()}));
document.querySelectorAll('[data-tg]').forEach(b=>b.onclick=()=>act(async()=>{const g=r.find(g=>g.id==b.dataset.tg);await api('/api/admin/godowns/'+g.id,'PUT',{...g,active:!g.active});VIEWS.gd()}))},
async set(){const s=await api('/api/admin/settings');const ml=s.mode_ledgers;$('#main').innerHTML=`<div class="card"><h2>Tally ledger names</h2><div class="mut" style="margin-bottom:10px">When staff take a payment, Tally debits this ledger. Names must match your Tally exactly.</div><div class="form"><label>Cash<input id="l_cash" value="${esc(ml.cash)}"></label><label>UPI<input id="l_upi" value="${esc(ml.upi)}"></label><label>Bank transfer<input id="l_bank" value="${esc(ml.bank)}"></label><label>Cheque<input id="l_cheque" value="${esc(ml.cheque)}"></label><label>Tally company (optional)<input id="co" value="${esc(s.tally_company)}"></label><button class="b" id="sv">Save</button></div></div>
<div class="card"><h2>Connect Tally</h2><ol><li>On the Tally PC: Tally → <b>F1 Help → Settings → Connectivity</b> → set <i>Tally acts as</i> = <b>Both</b> (port <b>9000</b>). Keep the company open.</li><li>Install Node.js, copy the <code>tally-bridge</code> folder, copy <code>config.example.json</code> to <code>config.json</code> and set:<br>serverUrl = <code>${esc(location.origin)}</code><br>bridgeKey = <code>${esc(s.bridge_key)}</code></li><li>Double-click <code>start-bridge.bat</code>. Customers load from Tally and every receipt appears in Tally within ~20 seconds.</li></ol></div>
<div class="card"><h2>Attendance webhook (optional)</h2><div class="mut" style="margin-bottom:8px">Every punch is POSTed as JSON to this URL (for other attendance/HR tools). Leave blank to disable. You can always download CSV from the Attendance tab.</div><div class="form"><label style="flex:1">Webhook URL<input id="wh" style="width:100%" value="${esc(s.webhook_url)}"></label><button class="b" id="sv2">Save</button></div></div>`;
const save=()=>act(async()=>{await api('/api/admin/settings','PUT',{mode_ledgers:{cash:$('#l_cash').value,upi:$('#l_upi').value,bank:$('#l_bank').value,cheque:$('#l_cheque').value},tally_company:$('#co').value,webhook_url:$('#wh').value});toast('Saved')});$('#sv').onclick=save;$('#sv2').onclick=save}};
start();
</script></body></html>
